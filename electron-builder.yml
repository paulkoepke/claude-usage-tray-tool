appId: com.paulkoepke.claude-usage-tray
productName: Usage Tray Tool for Claude
directories:
  output: dist
files:
  - out/**/*
  - resources/**/*
  - package.json
  - node_modules/**/*
asarUnpack:
  - resources/**/*
  - node_modules/@napi-rs/canvas/**/*
  - node_modules/@napi-rs/canvas-win32-x64-msvc/**/*
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-${version}-portable.${ext}
publish:
  provider: github
  owner: paulkoepke
  repo: claude-usage-tray-tool
