appId: com.paulkoepke.claude-usage-tray
productName: Usage Tray Tool for Claude
directories:
  output: dist
files:
  - out/**/*
  - resources/**/*
  - package.json
  - node_modules/**/*
asarUnpack:
  - resources/**/*
  - node_modules/@napi-rs/canvas/**/*
  - node_modules/@napi-rs/canvas-win32-x64-msvc/**/*
  - node_modules/@napi-rs/canvas-darwin-x64/**/*
  - node_modules/@napi-rs/canvas-darwin-arm64/**/*
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Usage-Tray-Tool-for-Claude-Setup-${version}.${ext}
portable:
  artifactName: Usage-Tray-Tool-for-Claude-${version}-portable.${ext}
mac:
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.utilities
  hardenedRuntime: false
publish:
  provider: github
  owner: paulkoepke
  repo: claude-usage-tray-tool
