name: Build & Release

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version: ${{ steps.set.outputs.version }}
      ref: ${{ steps.set.outputs.ref }}
      tag: ${{ steps.set.outputs.tag }}
      is_release: ${{ steps.set.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Determine next version
        if: github.ref == 'refs/heads/main'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Bump version
        if: github.ref == 'refs/heads/main'
        id: bump
        shell: bash
        run: |
          npm version ${{ steps.tag_version.outputs.new_version }} --no-git-tag-version --allow-same-version
          echo "version=${{ steps.tag_version.outputs.new_version }}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Set preview version
        if: github.ref != 'refs/heads/main'
        id: preview
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          echo "version=${base}-preview.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set job outputs
        id: set
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "version=${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=v${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.preview.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-win:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Apply preview version
        if: needs.version.outputs.is_release != 'true'
        shell: bash
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build app
        run: npm run build

      - name: Package Windows installer
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: claude-usage-tray-${{ needs.version.outputs.version }}-win
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-mac:
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Apply preview version
        if: needs.version.outputs.is_release != 'true'
        shell: bash
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build app
        run: npm run build

      - name: Package macOS app
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: claude-usage-tray-${{ needs.version.outputs.version }}-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [version, build-win, build-mac]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: claude-usage-tray-*
          merge-multiple: true

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: CHANGES.md
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
